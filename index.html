<!-- =======================================================

<script>


/* =========================================================
   CONFIGURACION SUPABASE
========================================================= */

const cfg =
  window.GOMEZFIT_CONFIG || {};


let sb = null;


let products = [];


let active = 'Todos';



/* =========================================================
   ELEMENTOS HTML
========================================================= */

const search =
  document.getElementById('search');


const catsEl =
  document.getElementById('cats');


const grid =
  document.getElementById('grid');


const title =
  document.getElementById('title');


const count =
  document.getElementById('count');



/* =========================================================
   CREAR CLIENTE SUPABASE
========================================================= */

if(

  cfg.SUPABASE_URL &&

  cfg.SUPABASE_PUBLISHABLE_KEY &&

  !cfg.SUPABASE_URL.includes('PEGA_AQUI')

){

  sb =
    supabase.createClient(

      cfg.SUPABASE_URL,

      cfg.SUPABASE_PUBLISHABLE_KEY

    );

}



/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}



/* =========================================================
   CONVERTIR IMAGEN A URL PUBLICA
========================================================= */

function getImageUrl(imageUrl){


  if(!imageUrl){

    return '';

  }


  imageUrl =
    String(imageUrl).trim();



  /* URL COMPLETA */

  if(

    imageUrl.startsWith('http://') ||

    imageUrl.startsWith('https://')

  ){

    return imageUrl;

  }



  /* BASE64 */

  if(

    imageUrl.startsWith('data:')

  ){

    return imageUrl;

  }



  /* NOMBRE DEL ARCHIVO */

  const fileName =

    imageUrl

      .split('/')

      .pop();



  const baseUrl =

    String(

      cfg.SUPABASE_URL || ''

    )

      .replace(/\/$/,'');



  if(!baseUrl){

    return '';

  }



  return (

    baseUrl +

    '/storage/v1/object/public/product-images/' +

    encodeURIComponent(fileName)

  );

}



/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function load(){


  /* SUPABASE NO CONFIGURADO */

  if(

    !cfg.SUPABASE_URL ||

    cfg.SUPABASE_URL.includes('PEGA_AQUI')

  ){

    grid.innerHTML = `

      <div class="message">

        Configura Supabase en config.js
        para cargar el catálogo online.

      </div>

    `;

    return;

  }



  /* CONSULTAR PRODUCTOS */

  const {

    data,

    error

  } = await sb

    .from('products')

    .select('*')

    .order(

      'id',

      {ascending:true}

    );



  /* ERROR */

  if(error){

    grid.innerHTML = `

      <div class="message">

        No se pudo cargar el catálogo.
        Revisa la configuración de Supabase.

      </div>

    `;

    console.error(error);

    return;

  }



  /* GUARDAR PRODUCTOS */

  products = data || [];



  /* =======================================================
     ORDEN DE CATEGORIAS
  ======================================================= */

  const categoryOrder = [

    ...new Set(

      products

        .map(

          product =>

            String(

              product.category || ''

            ).trim()

        )

        .filter(Boolean)

    )

  ];



  /* =======================================================
     ORDEN DE PRODUCTOS
  ======================================================= */

  products.sort((a,b)=>{


    const catA =

      categoryOrder.indexOf(

        String(

          a.category || ''

        ).trim()

      );


    const catB =

      categoryOrder.indexOf(

        String(

          b.category || ''

        ).trim()

      );



    /* ORDEN DE CATEGORIA */

    if(catA !== catB){

      return catA - catB;

    }



    /* ORDEN DENTRO DE CATEGORIA */

    return (

      (Number(a.sort_order) || 0)

      -

      (Number(b.sort_order) || 0)

    );

  });



  /* CREAR CATEGORIAS */

  renderCats();


  /* MOSTRAR PRODUCTOS */

  render();

}



/* =========================================================
   CREAR CATEGORIAS
========================================================= */

function renderCats(){


  const categories =

    products

      .map(

        product =>

          String(

            product.category || ''

          ).trim()

      )

      .filter(Boolean);



  const cats = [

    'Todos',

    ...new Set(categories)

  ];



  /* VERIFICAR CATEGORIA ACTIVA */

  if(

    active !== 'Todos' &&

    !cats.includes(active)

  ){

    active = 'Todos';

  }



  /* CREAR BOTONES */

  catsEl.innerHTML =

    cats

      .map(category=>{


        const isActive =

          category === active

            ? 'active'

            : '';



        return `

          <button

            type="button"

            class="chip ${isActive}"

            data-category="${encodeURIComponent(category)}"

          >

            ${escapeHtml(category)}

          </button>

        `;

      })

      .join('');



  /* EVENTOS */

  catsEl

    .querySelectorAll('.chip')

    .forEach(button=>{


      button.addEventListener(

        'click',

        function(){


          /* CATEGORIA */

          const category =

            decodeURIComponent(

              this.dataset.category

            );



          active = category;



          /* ACTUALIZAR CATEGORIAS */

          renderCats();



          /* ACTUALIZAR PRODUCTOS */

          render();



          /* SUBIR AL CATALOGO */

          document

            .getElementById('catalogo')

            .scrollIntoView({

              behavior:'smooth',

              block:'start'

            });

        }

      );

    });

}



/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function render(){


  /* BUSQUEDA */

  const q =

    search.value

      .toLowerCase()

      .trim();



  /* FILTRAR */

  const list =

    products.filter(product=>{


      const category =

        String(

          product.category || ''

        ).trim();



      const name =

        String(

          product.name || ''

        );



      const brand =

        String(

          product.brand || ''

        );



      const presentation =

        String(

          product.presentation || ''

        );



      /* CATEGORIA */

      const matchesCategory =

        active === 'Todos' ||

        category === active;



      /* TEXTO BUSCADOR */

      const searchText =

        `${name} ${brand} ${category} ${presentation}`

          .toLowerCase();



      const matchesSearch =

        !q ||

        searchText.includes(q);



      /* PRODUCTO ACTIVO */

      return (

        product.active !== false &&

        matchesCategory &&

        matchesSearch

      );

    });



  /* TITULO */

  title.textContent =

    active === 'Todos'

      ? 'Todos'

      : active;



  /* CONTADOR */

  count.textContent =

    `${list.length} productos`;



  /* SIN RESULTADOS */

  if(!list.length){

    grid.innerHTML = `

      <div class="message">

        No encontramos productos.

      </div>

    `;

    return;

  }



  /* =======================================================
     CREAR TARJETAS
  ======================================================= */

  grid.innerHTML =

    list

      .map(product=>{


        /* IMAGEN */

        const image =

          getImageUrl(

            product.image_url

          );



        /* NOMBRE */

        const name =

          escapeHtml(

            product.name ||

            'Producto'

          );



        /* CATEGORIA */

        const category =

          escapeHtml(

            product.category || ''

          );



        /* MARCA */

        const brand =

          escapeHtml(

            product.brand || ''

          );



        /* PRESENTACION */

        const presentation =

          escapeHtml(

            product.presentation || ''

          );



        /* PRECIO */

        const price =

          product.price !== null &&

          product.price !== undefined &&

          product.price !== ''

            ? '$' +

              Number(product.price)

                .toFixed(2)

            : 'Consultar';



        /* =================================================
           MENSAJE WHATSAPP
        ================================================= */

        const whatsappText =

          'Hola, estoy interesado en ' +

          (

            product.name ||

            'este producto'

          ) +

          (

            product.presentation

              ? ' (' +

                String(

                  product.presentation

                ).toLowerCase() +

                ')'

              : ''

          ) +

          '. ¿Sigue disponible?';



        const whatsappUrl =

          'https://wa.me/593968543741?text=' +

          encodeURIComponent(

            whatsappText

          );



        /* =================================================
           TARJETA
        ================================================= */

        return `

          <article class="card">


            <!-- FOTO -->

            <div class="photo">

              ${

                image

                  ? `

                    <img

                      loading="lazy"

                      src="${image}"

                      alt="${name}"

                    >

                  `

                  : ''

              }

            </div>



            <!-- INFORMACION -->

            <div class="info">


              <!-- CATEGORIA -->

              <div class="cat">

                ${category}

              </div>



              <!-- MARCA -->

              ${

                brand

                  ? `

                    <div class="brandName">

                      ${brand}

                    </div>

                  `

                  : ''

              }



              <!-- NOMBRE -->

              <div class="name">

                ${name}

              </div>



              <!-- PRESENTACION -->

              <div class="spec">

                ${presentation}

              </div>



              <!-- PRECIO -->

              <div class="price">

                ${price}

              </div>



              <!-- COMPRAR -->

              <a

                class="buy"

                target="_blank"

                rel="noopener"

                href="${whatsappUrl}"

              >

                COMPRAR POR WHATSAPP

              </a>


            </div>


          </article>

        `;

      })

      .join('');

}



/* =========================================================
   BUSCADOR
========================================================= */

search.addEventListener(

  'input',

  render

);



/* =========================================================
   INICIAR CATALOGO
========================================================= */

load();


</script>


</body>

</html>
