<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GOMEZFIT | Catálogo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#070707;
  color:#fff;
  font-family:Montserrat,Arial,sans-serif;
}

/* =========================
   NAVBAR
========================= */

.nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  background:rgba(5,5,5,.78);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.navin{
  max-width:1180px;
  margin:auto;
  padding:11px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  height:48px;
  width:auto;
  object-fit:contain;
}

.contacts{
  display:flex;
  gap:16px;
  align-items:center;
}

.contacts a{
  color:#ddd;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

.contacts a:hover{
  color:#d7ae45;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:94vh;
  position:relative;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
  background:#070707 url('assets/cover.png') center/cover no-repeat;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(0,0,0,.86),
    rgba(0,0,0,.30) 62%,
    rgba(0,0,0,.72)
  );
}

.heroIn{
  position:relative;
  z-index:2;
  max-width:1180px;
  width:100%;
  margin:auto;
  padding:120px 20px 58px;
}

.heroLogo{
  width:min(330px,70vw);
  display:block;
  margin-bottom:22px;
}

.slogan{
  font-family:Impact,"Arial Narrow",sans-serif;
  letter-spacing:1px;
  font-size:clamp(38px,7vw,70px);
  line-height:.9;
  max-width:620px;
  margin:0 0 28px;
}

.slogan span{
  color:#d8ad43;
}

.cta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:13px 18px;
  border-radius:7px;
  text-decoration:none;
  font-weight:900;
  font-size:12px;
}

.gold{
  background:#d6aa3d;
  color:#080808;
}

.white{
  background:#fff;
  color:#080808;
}

.explore{
  position:absolute;
  z-index:3;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  font-weight:900;
  letter-spacing:3px;
  color:#d6aa3d;
  white-space:nowrap;
}

/* =========================
   CATALOGO
========================= */

.wrap{
  max-width:1180px;
  margin:auto;
  padding:60px 20px 80px;
}

.tools{
  display:flex;
  gap:10px;
  margin-bottom:14px;
}

.search{
  width:100%;
  background:#111;
  border:1px solid #333;
  color:#fff;
  padding:14px 16px;
  border-radius:8px;
  font-size:14px;
  outline:none;
}

.search:focus{
  border-color:#d6aa3d;
}

/* =========================
   CATEGORIAS
========================= */

.cats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 15px;
  scrollbar-width:auto;
}

.chip{
  white-space:nowrap;
  background:#111;
  border:1px solid #333;
  color:#ddd;
  padding:9px 13px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.chip:hover,
.chip.active{
  background:#d6aa3d;
  color:#070707;
  border-color:#d6aa3d;
}

/* =========================
   TITULO
========================= */

.heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:15px 0;
}

.heading h2{
  font-size:28px;
  margin:0;
  font-weight:900;
}

.count{
  font-size:11px;
  color:#888;
}

/* =========================
   PRODUCTOS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:#101010;
  border:1px solid #222;
  border-radius:12px;
  overflow:hidden;
}

.photo{
  aspect-ratio:1;
  background:#f2f2f2;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.info{
  padding:13px;
}

.cat{
  font-size:9px;
  color:#b89543;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}

.name{
  font-weight:900;
  font-size:14px;
  margin-top:6px;
  min-height:35px;
}

.spec{
  color:#888;
  font-size:10px;
  min-height:25px;
}

.price{
  font-size:22px;
  font-weight:900;
  color:#d6aa3d;
  margin:8px 0 11px;
}

.buy{
  display:block;
  text-align:center;
  background:#fff;
  color:#070707;
  text-decoration:none;
  padding:10px;
  border-radius:6px;
  font-size:10px;
  font-weight:900;
}

.buy:hover{
  background:#d6aa3d;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:28px;
  color:#777;
  border-top:1px solid #222;
  font-size:11px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:620px){

  .contacts{
    gap:10px;
  }

  .contacts a{
    font-size:0;
  }

  .contacts a::first-letter{
    font-size:18px;
  }

  .hero{
    min-height:88vh;
  }

  .heroIn{
    padding:110px 20px 70px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .heroLogo{
    width:min(270px,70vw);
  }

  .slogan{
    font-size:46px;
  }

  .explore{
    font-size:10px;
    letter-spacing:2px;
  }

}

/* =========================
   MENSAJES
========================= */

.message{
  color:#888;
  padding:30px;
  text-align:center;
}
</style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="nav">

  <div class="navin">

    <img
      src="assets/logo.jpeg"
      class="brand"
      alt="GOMEZFIT"
    >

    <div class="contacts">

      <a
        href="https://wa.me/593968543741"
        target="_blank"
        rel="noopener"
      >
        WhatsApp
      </a>

      <a
        href="https://www.instagram.com/jgomez.fit/"
        target="_blank"
        rel="noopener"
      >
        Instagram
      </a>

      <a
        href="https://www.tiktok.com/@jgomez_fit"
        target="_blank"
        rel="noopener"
      >
        TikTok
      </a>

    </div>

  </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="heroIn">

    <img
      src="assets/logo.jpeg"
      class="heroLogo"
      alt="GOMEZFIT"
    >

    <h1 class="slogan">
      CONOCE.
      <span>ENTRENA.</span>
      EVOLUCIONA.
    </h1>

    <div class="cta">

      <a
        class="btn gold"
        href="#catalogo"
      >
        VER CATÁLOGO
      </a>

      <a
        class="btn white"
        href="https://wa.me/593968543741"
        target="_blank"
        rel="noopener"
      >
        COMPRAR POR WHATSAPP
      </a>

    </div>

  </div>

  <div class="explore">
    EXPLORA NUESTROS PRODUCTOS ↓
  </div>

</section>


<!-- =========================
     CATALOGO
========================= -->

<main
  class="wrap"
  id="catalogo"
>

  <div class="tools">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Buscar por nombre o categoría..."
      autocomplete="off"
    >

  </div>


  <div
    id="cats"
    class="cats"
  ></div>


  <div class="heading">

    <h2 id="title">
      Todos
    </h2>

    <span
      id="count"
      class="count"
    ></span>

  </div>


  <div
    id="grid"
    class="grid"
  ></div>

</main>


<footer>
  GOMEZFIT · Conocimiento · Acompañamiento · Rendimiento
</footer>


<script>

/* ==========================================
   CONFIGURACION SUPABASE
========================================== */

const cfg = window.GOMEZFIT_CONFIG || {};

let sb = null;

let products = [];

let active = 'Todos';


/* ==========================================
   ELEMENTOS HTML
========================================== */

const search = document.getElementById('search');
const catsEl = document.getElementById('cats');
const grid = document.getElementById('grid');
const title = document.getElementById('title');
const count = document.getElementById('count');


/* ==========================================
   CREAR CLIENTE SUPABASE
========================================== */

if (
  cfg.SUPABASE_URL &&
  cfg.SUPABASE_PUBLISHABLE_KEY &&
  !cfg.SUPABASE_URL.includes('PEGA_AQUI')
) {

  sb = supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_PUBLISHABLE_KEY
  );

}


/* ==========================================
   CONVERTIR IMAGEN A URL PUBLICA
========================================== */

function getImageUrl(imageUrl){

  if(!imageUrl){
    return '';
  }

  imageUrl = String(imageUrl).trim();

  /* Si ya es una URL completa */
  if(
    imageUrl.startsWith('http://') ||
    imageUrl.startsWith('https://')
  ){

    return imageUrl;

  }


  /* Si es una imagen base64/data */
  if(imageUrl.startsWith('data:')){

    return imageUrl;

  }


  /*
     Si image_url contiene una ruta de Supabase
     obtenemos solamente el nombre del archivo
  */

  const fileName =
    imageUrl.split('/').pop();


  /*
     URL PUBLICA DEL BUCKET
  */

  return (
    'https://rlcrfmfzjfahhkxkcdhq.supabase.co' +
    '/storage/v1/object/public/product-images/' +
    encodeURIComponent(fileName)
  );

}


/* ==========================================
   CARGAR PRODUCTOS
========================================== */

async function load(){

  if(!sb){

    grid.innerHTML = `
      <div class="message">
        No se pudo conectar con Supabase.
      </div>
    `;

    return;

  }


  const { data, error } = await sb
    .from('products')
    .select('*')
    .order('sort_order', {
      ascending:true,
      nullsFirst:false
    });


  if(error){

    console.error('Error Supabase:',error);

    grid.innerHTML = `
      <div class="message">
        No se pudo cargar el catálogo.
      </div>
    `;

    return;

  }


  products = Array.isArray(data)
    ? data
    : [];


  renderCats();

  render();

}


/* ==========================================
   CATEGORIAS
========================================== */

function renderCats(){

  /*
     Eliminamos categorías vacías
     y quitamos duplicados.
  */

  const categories = products
    .map(p => String(p.category || '').trim())
    .filter(Boolean);


  const cats = [
    'Todos',
    ...new Set(categories)
  ];


  /*
     Si la categoría activa ya no existe,
     volvemos a Todos.
  */

  if(
    active !== 'Todos' &&
    !cats.includes(active)
  ){

    active = 'Todos';

  }


  /*
     Creamos los botones.
  */

  catsEl.innerHTML = cats
    .map(category => {

      const isActive =
        category === active
          ? 'active'
          : '';

      return `
        <button
          type="button"
          class="chip ${isActive}"
          data-category="${encodeURIComponent(category)}"
        >
          ${escapeHtml(category)}
        </button>
      `;

    })
    .join('');


  /*
     Evento para cada categoría.
  */

  catsEl
    .querySelectorAll('.chip')
    .forEach(button => {

      button.addEventListener('click',function(){

        const category =
          decodeURIComponent(
            this.dataset.category
          );


        /*
           Cambiamos la categoría activa.
        */

        active = category;


        /*
           Actualizamos botones.
        */

        renderCats();


        /*
           Actualizamos productos.
        */

        render();


        /*
           Llevamos suavemente al inicio
           del catálogo.
        */

        document
          .getElementById('catalogo')
          .scrollIntoView({
            behavior:'smooth',
            block:'start'
          });

      });

    });

}


/* ==========================================
   ESCAPAR TEXTO HTML
========================================== */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* ==========================================
   MOSTRAR PRODUCTOS
========================================== */

function render(){

  const q =
    search.value
      .toLowerCase()
      .trim();


  /*
     Filtrar por categoría
     + búsqueda.
  */

  const list = products.filter(product => {

    const category =
      String(product.category || '').trim();


    const name =
      String(product.name || '');


    const presentation =
      String(product.presentation || '');


    const matchesCategory =
      active === 'Todos' ||
      category === active;


    const searchText =
      `${name} ${category} ${presentation}`
        .toLowerCase();


    const matchesSearch =
      !q ||
      searchText.includes(q);


    return (
      matchesCategory &&
      matchesSearch
    );

  });


  /*
     Título.
  */

  title.textContent =
    active === 'Todos'
      ? 'Todos'
      : active;


  /*
     Cantidad.
  */

  count.textContent =
    `${list.length} productos`;


  /*
     Si no hay resultados.
  */

  if(!list.length){

    grid.innerHTML = `
      <div class="message">
        No encontramos productos.
      </div>
    `;

    return;

  }


  /*
     Dibujar productos.
  */

  grid.innerHTML = list
    .map(product => {

      const image =
        getImageUrl(
          product.image_url
        );


      const name =
        escapeHtml(
          product.name || 'Producto'
        );


      const category =
        escapeHtml(
          product.category || ''
        );


      const presentation =
        escapeHtml(
          product.presentation || ''
        );


      const price =
        product.price !== null &&
        product.price !== undefined &&
        product.price !== ''
          ? '$' +
            Number(product.price)
              .toFixed(2)
          : 'Consultar';


      const whatsappText =
        'Hola, estoy interesado en ' +
        (product.name || 'este producto') +
        (
          product.presentation
            ? ' (' +
              String(product.presentation)
                .toLowerCase() +
              ')'
            : ''
        ) +
        '. ¿Sigue disponible?';


      const whatsappUrl =
        'https://wa.me/593968543741?text=' +
        encodeURIComponent(
          whatsappText
        );


      return `

        <article class="card">

          <div class="photo">

            ${
              image
                ? `
                  <img
                    loading="lazy"
                    src="${image}"
                    alt="${name}"
                    onerror="this.style.display='none';"
                  >
                `
                : ''
            }

          </div>


          <div class="info">

            <div class="cat">
              ${category}
            </div>


            <div class="name">
              ${name}
            </div>


            <div class="spec">
              ${presentation}
            </div>


            <div class="price">
              ${price}
            </div>


            <a
              class="buy"
              target="_blank"
              rel="noopener"
              href="${whatsappUrl}"
            >
              COMPRAR POR WHATSAPP
            </a>

          </div>

        </article>

      `;

    })
    .join('');

}


/* ==========================================
   BUSCADOR
========================================== */

search.addEventListener(
  'input',
  render
);


/* ==========================================
   INICIAR
========================================== */

load();

</script>

</body>
</html>
