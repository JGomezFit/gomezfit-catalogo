<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOMEZFIT | Catálogo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070707;color:#fff;font-family:Montserrat,Arial,sans-serif}
.nav{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(5,5,5,.78);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.navin{max-width:1180px;margin:auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between}.brand{height:48px;width:auto}.contacts{display:flex;gap:16px;align-items:center}.contacts a{color:#ddd;text-decoration:none;font-size:12px;font-weight:700}.contacts a:hover{color:#d7ae45}
.hero{min-height:94vh;position:relative;display:flex;align-items:flex-end;overflow:hidden;background:#070707 url('assets/cover.png') center/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.86),rgba(0,0,0,.30) 62%,rgba(0,0,0,.72))}
.heroIn{position:relative;z-index:2;max-width:1180px;width:100%;margin:auto;padding:120px 20px 58px}.heroLogo{width:min(330px,70vw);display:block;margin-bottom:22px}
.slogan{font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:1px;font-size:clamp(38px,7vw,70px);line-height:.9;max-width:620px;margin:0 0 28px}.slogan span{color:#d8ad43}
.cta{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:13px 18px;border-radius:7px;text-decoration:none;font-weight:900;font-size:12px}.gold{background:#d6aa3d;color:#080808}.white{background:#fff;color:#080808}
.explore{position:absolute;z-index:3;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#d6aa3d;white-space:nowrap}
.wrap{max-width:1180px;margin:auto;padding:60px 20px 80px}.tools{display:flex;gap:10px;margin-bottom:14px}.search{width:100%;background:#111;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:8px;font-size:14px;outline:none}.search:focus{border-color:#d6aa3d}
.cats{display:flex;gap:8px;overflow:auto;padding:5px 0 15px}.chip{white-space:nowrap;background:#111;border:1px solid #333;color:#ddd;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}.chip.active,.chip:hover{background:#d6aa3d;color:#070707;border-color:#d6aa3d}
.heading{display:flex;justify-content:space-between;align-items:end;margin:15px 0}.heading h2{font-size:28px;margin:0;font-weight:900}.count{font-size:11px;color:#888}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#101010;border:1px solid #222;border-radius:12px;overflow:hidden}.photo{aspect-ratio:1;background:#f2f2f2}.photo img{width:100%;height:100%;object-fit:contain}.info{padding:13px}.cat{font-size:9px;color:#b89543;font-weight:800;text-transform:uppercase;letter-spacing:1px}.name{font-weight:900;font-size:14px;margin-top:6px;min-height:35px}.spec{color:#888;font-size:10px;min-height:25px}.price{font-size:22px;font-weight:900;color:#d6aa3d;margin:8px 0 11px}.buy{display:block;text-align:center;background:#fff;color:#070707;text-decoration:none;padding:10px;border-radius:6px;font-size:10px;font-weight:900}.buy:hover{background:#d6aa3d}
footer{text-align:center;padding:28px;color:#777;border-top:1px solid #222;font-size:11px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.contacts a{font-size:0}.contacts a::first-letter{font-size:18px}.hero{min-height:88vh}.heroIn{padding:110px 20px 70px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.heroLogo{width:min(270px,70vw)}.slogan{font-size:46px}.explore{font-size:10px;letter-spacing:2px}}
</style>
</head>
<body>
<nav class="nav"><div class="navin"><img src="assets/logo.jpeg" class="brand" alt="GOMEZFIT"><div class="contacts"><a href="https://wa.me/593968543741" target="_blank" title="WhatsApp">WhatsApp</a><a href="https://www.instagram.com/jgomez.fit/" target="_blank">Instagram</a><a href="https://www.tiktok.com/@jgomez_fit" target="_blank">TikTok</a></div></div></nav>
<section class="hero"><div class="heroIn"><img src="assets/logo.jpeg" class="heroLogo" alt="GOMEZFIT"><h1 class="slogan">CONOCE. <span>ENTRENA.</span> EVOLUCIONA.</h1><div class="cta"><a class="btn gold" href="#catalogo">VER CATÁLOGO</a><a class="btn white" href="https://wa.me/593968543741" target="_blank">COMPRAR POR WHATSAPP</a></div></div><div class="explore">EXPLORA NUESTROS PRODUCTOS ↓</div></section>
<main class="wrap" id="catalogo"><div class="tools"><input id="search" class="search" placeholder="🔎 Buscar por nombre o categoría..."></div><div id="cats" class="cats"></div><div class="heading"><h2 id="title">Todos los productos</h2><span id="count"></span></div><div id="grid" class="grid"></div></main>
<footer>GOMEZFIT · Conocimiento · Acompañamiento · Rendimiento</footer>
<script>
const cfg=window.GOMEZFIT_CONFIG||{};const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);let products=[],active='Todos';
async function load(){if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('PEGA_AQUI')){grid.innerHTML='<div style="color:#aaa;padding:20px">Configura Supabase en config.js para cargar el catálogo online.</div>';return}const {data,error}=await sb.from('products').select('*').order('sort_order');if(error){grid.innerHTML='<div style="color:#aaa;padding:20px">No se pudo cargar el catálogo. Revisa la configuración de Supabase.</div>';console.error(error);return}products=data||[];renderCats();render()}

function renderCats(){
  const cats=['Todos',...new Set(products.map(p=>p.category))];

  catsEl.innerHTML=cats.map((c,i)=>`
    <button class="chip ${c===active?'active':''}" data-category="${i}">
      ${c}
    </button>
  `).join('');

  catsEl.querySelectorAll('.chip').forEach((btn,i)=>{
    btn.addEventListener('click',()=>{
      active=cats[i];
      renderCats();
      render();
    });
  });
}  
function render(){const q=search.value.toLowerCase().trim();const list=products.filter(p=>(active==='Todos'||p.category===active)&&(!q||`${p.name} ${p.category}`.toLowerCase().includes(q)));title.textContent=active;count.textContent=`${list.length} productos`;grid.innerHTML=list.length?list.map(p=>{const img=p.image_url&&p.image_url.startsWith('http')?p.image_url:(p.image_url||'').startsWith('data/')?p.image_url:'data/products/'+(p.image_url||'').split('/').pop();return `<article class="card"><div class="photo"><img loading="lazy" src="${img}" alt="${p.name}"></div><div class="info"><div class="cat">${p.category}</div><div class="name">${p.name}</div><div class="spec">${p.presentation||''}</div><div class="price">${p.price!=null?'$'+Number(p.price).toFixed(2):'Consultar'}</div><a class="buy" target="_blank" href="https://wa.me/593968543741?text=${encodeURIComponent('Hola, estoy interesado en '+p.name+(p.presentation?' ('+p.presentation.toLowerCase()+')':'')+'. ¿Sigue disponible?')}">COMPRAR POR WHATSAPP</a></div></article>`}).join(''):'<div style="color:#888;padding:30px">No encontramos productos.</div>'}
const search=document.getElementById('search'),catsEl=document.getElementById('cats'),grid=document.getElementById('grid'),title=document.getElementById('title'),count=document.getElementById('count');search.addEventListener('input',render);load();
</script>
</body></html>
